<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendar | Vayro</title>
  <script>try{var t=localStorage.getItem("vayro-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="companion.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body data-page="calendar">
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="index.html" aria-label="Vayro overview">Vayro</a>
      <nav class="nav" aria-label="Main navigation">
        <a class="nav-link" href="index.html">Overview</a>
        <a class="nav-link" href="assignments.html">Assignments</a>
        <a class="nav-link active" href="calendar.html" aria-current="page">Calendar</a>
        <a class="nav-link" href="planner.html">Study planner</a>
        <a class="nav-link" href="grades.html">Grades</a>
        <a class="nav-link" href="materials.html">Study library</a>
        <a class="nav-link" href="analytics.html">Analytics</a>
      </nav>
      <nav class="nav nav-secondary" aria-label="Account navigation">
        <a class="nav-link" href="integrations.html">Integrations</a>
        <a class="nav-link" href="settings.html">Settings</a>
      </nav>
      <div class="profile"><strong class="profile-name">Arnav</strong><small>Personal workspace</small></div>
    </aside>
    <main class="main">
      <header class="page-head">
        <h1>Calendar</h1>
        <div class="head-tools">
          <time id="live-date"></time><time id="live-clock"></time>
          <div class="seg" role="group" aria-label="Theme"><button type="button" data-theme-choice="light" aria-pressed="false">Light</button><button type="button" data-theme-choice="dark" aria-pressed="false">Dark</button></div>
        </div>
      </header>

      <div class="toolbar">
        <span></span>
        <button class="button primary" type="button" data-open="event">New event</button>
      </div>

      <section class="calendar-layout">
        <div>
          <div class="calendar-head"><h2 id="calendar-title"></h2><div class="calendar-controls"><button type="button" id="month-prev" aria-label="Previous month">&lt;</button><button type="button" id="month-next" aria-label="Next month">&gt;</button></div></div>
          <div class="weekdays"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
          <div class="calendar-grid" id="calendar-grid"></div>
        </div>
        <aside class="day-panel">
          <h2 id="selected-date">Today</h2>
          <div id="day-events" class="ledger"></div>
        </aside>
      </section>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <dialog id="item-dialog"><form id="event-form" class="panel form-grid"><div class="field full"><span>Event title</span><input name="title" required></div><div class="field"><span>Date</span><input name="date" type="date" required></div><div class="field"><span>Start time</span><input name="time" type="time"></div><div class="field"><span>Type</span><select name="type"><option>Class</option><option>Study</option><option>Test</option><option>Personal</option><option>Other</option></select></div><div class="field"><span>Duration</span><select name="duration"><option value="30">30 minutes</option><option value="60" selected>1 hour</option><option value="90">1.5 hours</option><option value="120">2 hours</option></select></div><div class="field full"><span>Details</span><textarea name="notes"></textarea></div><div class="form-actions full"><button type="button" class="button secondary" data-close>Cancel</button><button type="submit" class="button primary">Save event</button></div></form></dialog>
</body>
</html>
