<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analytics | Vayro</title>
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("vayro-theme")||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="companion.js" defer></script>
  <script src="moon-guide.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body data-page="analytics">
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="index.html" aria-label="Vayro overview">Vayro</a>
      <nav class="nav" aria-label="Main navigation">
        <a class="nav-link" href="index.html">Overview</a>
        <a class="nav-link" href="assignments.html">Assignments</a>
        <a class="nav-link" href="calendar.html">Calendar</a>
        <a class="nav-link" href="planner.html">Study planner</a>
        <a class="nav-link" href="grades.html">Grades</a>
        <a class="nav-link" href="materials.html">Study library</a>
        <a class="nav-link active" href="analytics.html" aria-current="page">Analytics</a>
      </nav>
      <nav class="nav nav-secondary" aria-label="Account navigation">
        <a class="nav-link" href="integrations.html">Integrations</a>
        <a class="nav-link" href="settings.html">Settings</a>
      </nav>
      <div class="profile"><strong class="profile-name">Arnav</strong><small>Personal workspace</small></div>
    </aside>
    <main class="main">
      <header class="page-head">
        <h1>Analytics</h1>
        <div class="head-tools">
          <time id="live-date"></time><time id="live-clock"></time>
          <div class="seg" role="group" aria-label="Theme"><button type="button" data-theme-choice="light" aria-pressed="false">Light</button><button type="button" data-theme-choice="dark" aria-pressed="false">Dark</button></div>
        </div>
      </header>

      <section class="metric-grid" aria-label="Summary">
        <div class="figure"><small id="completion-detail"></small><div class="progress"><span id="completion-bar"></span></div><strong id="completion-rate">0%</strong><span>Assignments completed</span></div>
        <div class="figure"><strong id="focus-total">0h</strong><span>Focus time</span></div>
        <div class="figure"><strong id="analytics-average">No data</strong><span>Average</span></div>
      </section>

      <div class="analytics-layout">
        <section class="analytics-focus">
          <div class="analytics-section-head"><div><h2>Focus time</h2><p>Sessions from the past seven days</p></div><span class="eyebrow">Minutes per day</span></div>
          <div id="focus-week" class="focus-week" aria-label="Focus sessions during the last seven days"></div>
        </section>
        <section class="analytics-subjects">
          <h2 class="section-title">Grade average by subject</h2>
          <div id="subject-bars" class="bar-list"></div>
        </section>
      </div>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>
</body>
</html>
