<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grades | Vayro</title>
  <script>try{var t=localStorage.getItem("vayro-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body data-page="grades">
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="index.html" aria-label="Vayro overview">Vayro</a>
      <nav class="nav" aria-label="Main navigation">
        <a class="nav-link" href="index.html">Overview</a>
        <a class="nav-link" href="assignments.html">Assignments</a>
        <a class="nav-link" href="calendar.html">Calendar</a>
        <a class="nav-link" href="planner.html">Study planner</a>
        <a class="nav-link active" href="grades.html" aria-current="page">Grades</a>
        <a class="nav-link" href="materials.html">Study library</a>
        <a class="nav-link" href="analytics.html">Analytics</a>
      </nav>
      <nav class="nav nav-secondary" aria-label="Account navigation">
        <a class="nav-link" href="integrations.html">Integrations</a>
        <a class="nav-link" href="settings.html">Settings</a>
      </nav>
      <div class="profile"><strong class="profile-name">Arnav</strong><small>Personal workspace</small></div>
    </aside>
    <main class="main">
      <header class="page-head">
        <h1>Grades</h1>
        <div class="head-tools">
          <time id="live-date"></time><time id="live-clock"></time>
          <div class="seg" role="group" aria-label="Theme"><button type="button" data-theme-choice="light" aria-pressed="false">Light</button><button type="button" data-theme-choice="dark" aria-pressed="false">Dark</button></div>
        </div>
      </header>

      <section class="metric-grid" aria-label="Grade summary">
        <div class="figure"><strong id="grade-average">No data</strong><span>Average</span></div>
        <div class="figure"><strong id="grade-count">0</strong><span>Assessments</span></div>
        <div class="figure"><strong id="grade-subject-count">0</strong><span>Subjects</span></div>
      </section>

      <div class="toolbar">
        <span></span>
        <button class="button primary" type="button" data-open="grade">Add grade</button>
      </div>

      <section class="panel">
        <table class="data-table">
          <thead><tr><th>Assessment</th><th>Subject</th><th>Date</th><th>Score</th><th></th></tr></thead>
          <tbody id="grade-list"></tbody>
        </table>
      </section>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <dialog id="item-dialog"><form id="grade-form" class="panel form-grid"><div class="field full"><span>Assessment name</span><input name="title" required></div><div class="field"><span>Subject</span><input name="subject" required></div><div class="field"><span>Date</span><input name="date" type="date" required></div><div class="field"><span>Points earned</span><input name="score" type="number" min="0" step="0.01" required></div><div class="field"><span>Points possible</span><input name="max" type="number" min="0.01" step="0.01" required></div><div class="form-actions full"><button type="button" class="button secondary" data-close>Cancel</button><button type="submit" class="button primary">Save grade</button></div></form></dialog>
</body>
</html>
